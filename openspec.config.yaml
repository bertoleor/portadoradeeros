# openspec.config.yaml — contrato de calibración SDD Init (GATE-CFG-01/02/03)
# Generado 2026-09-15 por inspección del repo. Si cambia el stack o aparecen
# nuevos runners, re-calibrar antes de arrancar cualquier cambio.
proyecto: EROS
stack:
  - nextjs-16
  - react-19
  - typescript
  - nodejs
  - pnpm
runners:
  unit: pnpm test
  e2e: pnpm test:e2e
  typecheck: pnpm typecheck
  lint: pnpm lint
strict_tdd: true
convenciones:
  - typescript-strict
  - tsconfig
  - zod-4
  - tailwind-4
  - react-hook-form
  - supabase
  - tiptap
  - eslint
  - prettier
  - husky
  - changesets
