schema: spec-driven

context: |
  Tech stack: Next.js 16 (App Router) + React 19 + TypeScript 5 (strict), Tailwind CSS 4, shadcn/ui (Radix/base-ui).
  Backend: Supabase (Postgres) via @supabase/ssr + supabase-js; Resend (default) with SMTP fallback via EMAIL_PROVIDER for email; web-push for notifications.
  Architecture: App Router route groups, client/server components, path alias `@/*` -> `./src/*`, SQL migrations in `migrations/`.
  Testing: Vitest 3 (unit/smoke), strict_tdd disabled.
  Style: ESLint (next config), TypeScript strict, no formatter configured.

strict_tdd: false

testing:
  strict_tdd: false
  test_runner: vitest
  test_command: 'npm run test'
  coverage: 'npm run test -- --coverage'
  linter: 'npx eslint'
  type_checker: 'npx tsc --noEmit'

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - tdd: false
    - test_command: ''
  verify:
    test_command: 'npm run test'
    build_command: 'npm run build'
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
