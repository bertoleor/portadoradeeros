name: CI

on:
  push:
    branches: [main, develop, feat/eros-deps]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Format check
        run: npm run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck]
    if:
      github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref ==
      'refs/heads/feat/eros-deps'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          # Public by design (anon key is client-safe); required by the
          # prerender of `/` — without them the static export fails.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Run E2E
        run: npm run test:e2e

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run npm audit
        # EROS-DEPS-RuntimeVulns gate: STRICT for production runtime deps
        # (--omit=dev). Dev-only tooling vulns (shadcn->ts-morph->braces chain,
        # 9 HIGH) are out of scope here and tracked in .trivyignore for Trivy;
        # the breaking shadcn major bump is a follow-up ticket.
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scasbom:
    name: Trivy SCA/SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          path: .
          exit-code: 1
          ignore-unfixed: true
        env:
          # Dev-only tooling vulns (shadcn chain) documented with expiry.
          TRIVY_IGNOREFILE: ./.trivyignore

  sast-semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
  supply-sign:
    name: SBOM sign (Sigstore keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          path: .
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: 0
        env:
          TRIVY_IGNOREFILE: ./.trivyignore
      - name: Cosign install
        uses: sigstore/cosign-installer@v3
      - name: Sign SBOM
        run:
          cosign sign-blob --yes sbom.cdx.json --output-signature sbom.cdx.sig --output-certificate
          sbom.cdx.pem
